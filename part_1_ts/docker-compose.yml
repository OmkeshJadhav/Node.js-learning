services:
  postgres:
    image: postgres:16-alpine
    container-name: nodejs-capstone-project
    restart: unless-stopped

    ports:
      - "5432:5435"

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nodejs-capstone

    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres_data:
